<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>공시지가 산정 — 표준지 GIS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================ 사이드 패널 ============================ -->
<div id="side-panel">
    <div class="panel-header">
        <h1>공시지가 산정</h1>
        <div class="subtitle" id="hdr-region">표준지 공시지가 검토 · GIS</div>
        <div class="panel-count">표시 <span id="cnt-shown">0</span> / 전체 <span id="cnt-total">0</span> 필지</div>
        <div class="sync-status" id="geo-status">좌표 상태 확인 중…</div>
        <div class="geo-bar">
            <button id="btn-geo-run">📍 좌표 변환</button>
            <button id="btn-geo-stop" disabled>■ 중지</button>
            <button id="btn-geo-import">⬆ 좌표 CSV</button>
            <button id="btn-geo-export">⬇ coords.js 저장</button>
        </div>
        <input type="file" id="geo-file" accept=".csv,.txt" hidden>
        <div class="geo-progress" id="geo-progress"><i></i></div>
    </div>

    <div class="filter-section">
        <label>읍 · 면</label>
        <div class="filter-row" id="f-eup"></div>
        <label class="mini-label">이용상황</label>
        <div class="filter-row" id="f-use"></div>
        <input type="text" class="search-input" id="f-search" placeholder="소재지 · 지번 · PNU 검색…" style="margin-top:9px;">
        <label class="mini-label">지목 / 용도지역</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
            <select class="sel" id="f-jimok"></select>
            <select class="sel" id="f-zone"></select>
        </div>
        <label class="toggle-row"><input type="checkbox" id="f-flagged"> 검수 대상(이상치)만 보기</label>
        <label class="toggle-row"><input type="checkbox" id="f-nogeo"> 좌표 미확보 필지만 보기</label>
    </div>

    <div class="filter-section">
        <label>지도 색상 기준</label>
        <select class="sel" id="f-metric">
            <option value="price">공시지가 (원/㎡)</option>
            <option value="chg">전년 대비 증감률 (%)</option>
            <option value="mkt">시가수준 (원/㎡)</option>
            <option value="r27">&#39;27 반영률 (%)</option>
            <option value="gap">A·B조 격차율 (%)</option>
            <option value="resid">산정 오차 (공시지가 − 시가수준×반영률)</option>
            <option value="zdev">균형성 편차 (동일 그룹 대비)</option>
        </select>
        <label class="toggle-row"><input type="checkbox" id="f-label" checked> 지가 라벨 표시 (확대 시)</label>
    </div>

    <div id="list-container"><div class="empty-state">데이터 로딩 중…</div></div>
</div>

<!-- ============================ 지도 ============================ -->
<div id="map"></div>

<div id="toolbar">
    <button id="btn-calc">🧮 산정</button>
    <button id="btn-audit">🚩 검수</button>
    <button id="btn-stats">📊 통계</button>
    <button id="btn-heat">🔥 히트맵</button>
</div>

<div id="legend">
    <div class="lg-title" id="lg-title">공시지가 (원/㎡)</div>
    <div id="lg-rows"></div>
    <div class="lg-note" id="lg-note">원 크기 = 필지 면적</div>
</div>

<!-- ============================ 산정 패널 ============================ -->
<div class="float" id="calc-float">
    <div class="fl-head"><span>🧮 공시지가 산정 · 검증</span><button data-close="calc-float">×</button></div>
    <div class="fl-body" id="calc-body">
        <div class="calc-empty">지도의 필지 또는 좌측 목록에서<br>표준지를 선택하세요.</div>
    </div>
</div>

<!-- ============================ 검수 패널 ============================ -->
<div class="float" id="audit-float">
    <div class="fl-head"><span>🚩 검수 대상 (이상치)</span><button data-close="audit-float">×</button></div>
    <div class="fl-body">
        <div class="sec-h" style="margin:0 0 8px;">검수 기준 (임계값 조정 가능)</div>
        <div class="slider-row">
            <div class="sl-top"><span>산정 오차 허용</span><b id="v-th-resid">0.5%</b></div>
            <input type="range" id="th-resid" min="0" max="5" step="0.1" value="0.5">
        </div>
        <div class="slider-row">
            <div class="sl-top"><span>A·B조 격차율</span><b id="v-th-gap">3.0%</b></div>
            <input type="range" id="th-gap" min="0" max="15" step="0.5" value="3">
        </div>
        <div class="slider-row">
            <div class="sl-top"><span>전년 대비 증감률</span><b id="v-th-chg">10.0%</b></div>
            <input type="range" id="th-chg" min="0" max="40" step="1" value="10">
        </div>
        <div class="slider-row">
            <div class="sl-top"><span>균형성 편차 (z)</span><b id="v-th-z">2.0σ</b></div>
            <input type="range" id="th-z" min="1" max="4" step="0.1" value="2">
        </div>
        <div class="btn-line">
            <button id="btn-audit-csv">⬇ 검수목록 CSV</button>
            <button class="primary" id="btn-audit-focus">지도에 검수대상만</button>
        </div>
        <div class="sec">
            <div class="sec-h">검수 목록 <span id="audit-count" style="color:var(--critical)"></span></div>
            <div id="audit-list"></div>
        </div>
    </div>
</div>

<!-- ============================ 통계 패널 ============================ -->
<div class="float" id="stats-float">
    <div class="fl-head"><span>📊 현재 필터 통계</span><button data-close="stats-float">×</button></div>
    <div class="fl-body" id="stats-body"></div>
</div>

<div id="panel-overlay"></div>
<button id="mobile-toggle">📋 목록 보기</button>

<!-- ============================ 스크립트 ============================ -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<!-- 카카오 지도 SDK: 지오코딩(주소→좌표) 전용. 배경지도는 Leaflet 타일 사용 -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9185cfe0d3dcbd94326f64f4338462f1&libraries=services&autoload=false"></script>

<script src="data/parcels.js"></script>
<script src="data/coords.js"></script>
<script src="js/appraise.js"></script>
<script src="js/geocode.js"></script>
<script src="js/app.js"></script>
</body>
</html>
