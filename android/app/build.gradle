plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.gongsi.gis'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.gongsi.gis'
        minSdk 24              // Android 7.0 — ServiceWorkerController 사용
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // 사내 배포(사이드로드)용. 난독화는 쓰지 않는다 —
            // JavascriptInterface 메서드가 제거되면 CSV 저장이 깨진다.
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
